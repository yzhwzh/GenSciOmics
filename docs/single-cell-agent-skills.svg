  <text x="380" y="254" font-size="12.5" fill="#94A3B8">分组只是取材视角；LLM 看到的是平铺的 11 条 name + description，自行选择</text>
  <line x1="40" y1="266" x2="1560" y2="266" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 组 A -->
  <rect x="40" y="273" width="10" height="10" rx="2" fill="#7C3AED"/>
  <text x="60" y="284" font-size="15" font-weight="700" fill="#7C3AED">A · 细胞类型注释</text>
  <text x="244" y="284" font-size="12.5" fill="#94A3B8">把已聚类的簇映射成生物学身份</text>
  <text x="1560" y="284" font-size="11.5" fill="#94A3B8" text-anchor="end">2 个 skill</text>

  <rect x="40" y="294" width="748" height="150" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.2"/>
  <rect x="41" y="295" width="4" height="148" rx="2" fill="#7C3AED"/>
  <text x="60" y="320" font-size="16" font-weight="700" fill="#5B21B6">single-annotation</text>
  <text x="60" y="345" font-size="13.5" fill="#334155">6 条并列注释路线 —— SCSA 自动簇注释 / MetaTiME 微环境状态 / CellVote 共识 /</text>
  <text x="60" y="364" font-size="13.5" fill="#334155">CellMatch 本体映射 / GPTAnno / 加权 KNN 标签迁移</text>
  <text x="60" y="389" font-size="12.5" fill="#475569">输入 · 已聚类 AnnData + marker 表；CellVote 需 ≥2 个既有注释列；MetaTiME 需 obsm['X_scVI']</text>
  <text x="60" y="414" font-size="12.5" fill="#475569">产出 · adata.obs 注释列：scsa_celltype_cellmarker / MetaTiME / CellVote_celltype /</text>
  <text x="60" y="433" font-size="12.5" fill="#475569">cell_ontology / gpt_celltype / transf_celltype</text>

  <rect x="812" y="294" width="748" height="150" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.2"/>
  <rect x="813" y="295" width="4" height="148" rx="2" fill="#7C3AED"/>
  <text x="832" y="320" font-size="16" font-weight="700" fill="#5B21B6">single-cell-annotation</text>
  <text x="832" y="345" font-size="13.5" fill="#334155">ov.single.Annotation(adata) 单一门面，三选一后端（文档明写互斥，非串行阶段）：</text>
  <text x="832" y="364" font-size="13.5" fill="#334155">CellTypist / gpt4celltype / SCSA</text>
  <text x="832" y="389" font-size="12.5" fill="#475569">输入 · 已归一化含 cluster 列的 AnnData；CellTypist 需模型 .pkl；gpt4celltype 需 AGI_API_KEY</text>
  <text x="832" y="414" font-size="12.5" fill="#475569">产出 · obs['celltypist_prediction'] + obsm['celltypist_decision_matrix'] /</text>
  <text x="832" y="433" font-size="12.5" fill="#475569">obs['gpt4celltype_prediction'] / obs['scsa_prediction']</text>

  <!-- 组 B -->
  <rect x="40" y="449" width="10" height="10" rx="2" fill="#2563EB"/>
  <text x="60" y="460" font-size="15" font-weight="700" fill="#2563EB">B · 状态动力学与轨迹</text>
  <text x="244" y="460" font-size="12.5" fill="#94A3B8">从速度矢量到命运概率与伪时间</text>
  <text x="1560" y="460" font-size="11.5" fill="#94A3B8" text-anchor="end">3 个 skill</text>

  <rect x="40" y="470" width="490" height="150" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <rect x="41" y="471" width="4" height="148" rx="2" fill="#2563EB"/>
  <text x="60" y="496" font-size="16" font-weight="700" fill="#1E3A8A">single-cell-rna-velocity</text>
  <text x="60" y="521" font-size="13.5" fill="#334155">RNA 速率；覆盖 scvelo / dynamo /</text>
  <text x="60" y="540" font-size="13.5" fill="#334155">latentvelo / graphvelo 四类后端</text>
  <text x="60" y="565" font-size="12.5" fill="#475569">输入 · 含 spliced/unspliced 层的 .h5ad</text>
  <text x="60" y="590" font-size="12.5" fill="#475569">产出 · layers[velocity_key] · Ms/Mu ·</text>
  <text x="60" y="609" font-size="12.5" fill="#475569">velocity_S_graph · velocity_gv* · leiden</text>

  <rect x="554" y="470" width="490" height="150" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <rect x="555" y="471" width="4" height="148" rx="2" fill="#2563EB"/>
  <text x="574" y="496" font-size="16" font-weight="700" fill="#1E3A8A">single-cell-cellrank-fate</text>
  <text x="574" y="521" font-size="13.5" fill="#334155">VelocityKernel + ConnectivityKernel</text>
  <text x="574" y="540" font-size="13.5" fill="#334155">混合 → GPCCA → 宏观态 / 终态与命运概率</text>
  <text x="574" y="565" font-size="12.5" fill="#475569">输入 · 需已有 velocity / velocity_graph / Ms</text>
  <text x="574" y="590" font-size="12.5" fill="#475569">产出 · obs 命运概率列（如 beta_fate）·</text>
  <text x="574" y="609" font-size="12.5" fill="#475569">macrostates / terminal_states · 分支流图</text>

  <rect x="1068" y="470" width="490" height="150" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <rect x="1069" y="471" width="4" height="148" rx="2" fill="#2563EB"/>
  <text x="1088" y="496" font-size="16" font-weight="700" fill="#1E3A8A">single-cell-trajectory-inference</text>
  <text x="1088" y="521" font-size="13.5" fill="#334155">ov.single.TrajInfer；方法三选一</text>
  <text x="1088" y="540" font-size="13.5" fill="#334155">diffusion_map / slingshot / palantir，PAGA 汇总</text>
  <text x="1088" y="565" font-size="12.5" fill="#475569">输入 · cluster-ready AnnData；origin label 必须存在</text>
  <text x="1088" y="590" font-size="12.5" fill="#475569">产出 · obs 各方法伪时间列（dpt/slingshot/palantir）</text>
  <text x="1088" y="609" font-size="12.5" fill="#475569">obsm['palantir_fate_probabilities'] · uns['paga']</text>

  <!-- 组 C -->
  <rect x="40" y="625" width="10" height="10" rx="2" fill="#0891B2"/>
