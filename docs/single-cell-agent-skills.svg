  <text x="60" y="697" font-size="13.5" fill="#334155">转录因子调控网络 → regulon → AUCell 活性打分；GRN 分支</text>
  <text x="60" y="716" font-size="13.5" fill="#334155">三选一 RegDiffusion / GRNBoost2 / GENIE3</text>
  <text x="60" y="741" font-size="12.5" fill="#475569">输入 · 稀疏 raw-count layer（拒绝已 log-normalized）；cisTarget 库与 motif 表需自备，本 skill 不下载</text>
  <text x="60" y="766" font-size="12.5" fill="#475569">产出 · adjacencies · regulons · auc_mtx · RSS 表 ·</text>
  <text x="60" y="785" font-size="12.5" fill="#475569">二值活性矩阵 · TF 调控网络图</text>

  <rect x="812" y="646" width="748" height="150" rx="10" fill="#ECFEFF" stroke="#67E8F9" stroke-width="1.2"/>
  <rect x="813" y="647" width="4" height="148" rx="2" fill="#0891B2"/>
  <text x="832" y="672" font-size="16" font-weight="700" fill="#164E63">single-cell-cellphonedb-communication</text>
  <text x="832" y="697" font-size="13.5" fill="#334155">CellPhoneDB v5 配受体分析 + CellChat 风格可视化</text>
  <text x="832" y="716" font-size="13.5" fill="#334155">（网络 / bubble / chord / 信号角色热图）</text>
  <text x="832" y="741" font-size="12.5" fill="#475569">输入 · 带有效细胞类型列的注释 AnnData；矩阵需 log-normalized 且非 scaled</text>
  <text x="832" y="766" font-size="12.5" fill="#475569">产出 · cpdb_results（means / pvalues）· adata_cpdb 与通路通讯强度 ·</text>
  <text x="832" y="785" font-size="12.5" fill="#475569">中心性得分 · sender / receiver layers</text>

  <!-- 组 D -->
  <rect x="40" y="801" width="10" height="10" rx="2" fill="#059669"/>
  <text x="60" y="812" font-size="15" font-weight="700" fill="#059669">D · 差异表达与统计</text>
  <text x="244" y="812" font-size="12.5" fill="#94A3B8">组间比较与通用统计出口</text>
  <text x="1560" y="812" font-size="11.5" fill="#94A3B8" text-anchor="end">2 个 skill</text>

  <rect x="40" y="822" width="748" height="150" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2"/>
  <rect x="41" y="823" width="4" height="148" rx="2" fill="#059669"/>
  <text x="60" y="848" font-size="16" font-weight="700" fill="#065F46">single-cell-differential-expression</text>
  <text x="60" y="873" font-size="13.5" fill="#334155">指定细胞类型内做 condition vs condition 差异表达；</text>
  <text x="60" y="892" font-size="13.5" fill="#334155">后端三选一 wilcoxon / t-test / memento-de</text>
  <text x="60" y="917" font-size="12.5" fill="#475569">输入 · obs 含 condition 列与细胞类型列；建议保留 raw counts 于 adata.raw 或 layers['counts']</text>
  <text x="60" y="942" font-size="12.5" fill="#475569">产出 · DEG 表（log2FC · pvalue · padj · qvalue · baseMean ·</text>
  <text x="60" y="961" font-size="12.5" fill="#475569">pct_ctrl · pct_test · pct_diff）</text>

  <rect x="812" y="822" width="748" height="150" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2"/>
  <rect x="813" y="823" width="4" height="148" rx="2" fill="#059669"/>
  <text x="832" y="848" font-size="16" font-weight="700" fill="#065F46">statistical-analysis</text>
  <rect x="1332" y="832" width="212" height="22" rx="11" fill="#059669"/>
  <text x="1438" y="847" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">11 个里唯一自带生产脚本</text>
  <text x="832" y="873" font-size="13.5" fill="#334155">共表达 / 相关 · Venn·UpSet 组合计数表 · marker 基因 · 表达可视化 ·</text>
  <text x="832" y="892" font-size="13.5" fill="#334155">统计检验 · CSV 导出 · 基因功能查询（mygene.info）</text>
  <text x="832" y="917" font-size="12.5" fill="#475569">输入 · .h5ad 路径；obs 列名按约定 CellType / Sample / Group</text>
  <text x="832" y="942" font-size="12.5" fill="#475569">产出 · PNG（/api/results?file=）· Markdown 计数表 · CSV 到 /tmp/gensci_results/</text>
  <text x="832" y="961" font-size="12.5" fill="#475569">stdout 统计量与 p 值 · 由 7 个 scripts/*.py 执行</text>

  <!-- 组 E -->
  <rect x="40" y="977" width="10" height="10" rx="2" fill="#4F46E5"/>
  <text x="60" y="988" font-size="15" font-weight="700" fill="#4F46E5">E · 表征与下游工具箱</text>
  <text x="244" y="988" font-size="12.5" fill="#94A3B8">基础模型嵌入与教程式下游清单</text>
  <text x="1560" y="988" font-size="11.5" fill="#94A3B8" text-anchor="end">2 个 skill</text>

  <rect x="40" y="998" width="748" height="150" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <rect x="41" y="999" width="4" height="148" rx="2" fill="#4F46E5"/>
  <text x="60" y="1024" font-size="16" font-weight="700" fill="#312E81">single-cell-foundation-model</text>
  <text x="60" y="1049" font-size="13.5" fill="#334155">经 ov.llm.SCLLMManager 统一调用 5 个基础模型 ——</text>
  <text x="60" y="1068" font-size="13.5" fill="#334155">scGPT / Geneformer / scFoundation / UCE / CellPLM</text>
  <text x="60" y="1093" font-size="12.5" fill="#475569">输入 · .h5ad；Geneformer 需 var 内 ENSEMBL ID；整合需 batch_key；需各后端 checkpoint</text>
  <text x="60" y="1118" font-size="12.5" fill="#475569">产出 · obsm['X_&lt;backend&gt;'] —— 依次 512 / 256 / 768 / 1280 / 512 维，</text>
  <text x="60" y="1137" font-size="12.5" fill="#475569">对应上述 5 个后端</text>

  <rect x="812" y="998" width="748" height="150" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <rect x="813" y="999" width="4" height="148" rx="2" fill="#4F46E5"/>
  <text x="832" y="1024" font-size="16" font-weight="700" fill="#312E81">single-downstream-analysis</text>
  <text x="832" y="1049" font-size="13.5" fill="#334155">8 个 OmicVerse 下游教程的可执行 checklist —— AUCell 通路打分 /</text>
  <text x="832" y="1068" font-size="13.5" fill="#334155">metacell DEG / scDrug 药敏 / cNMF / NOCD / lazy 报告</text>
  <text x="832" y="1093" font-size="12.5" fill="#475569">输入 · 含 clustering + embedding 的 AnnData；SCENIC 段需非 log 变换的 raw counts</text>
  <text x="832" y="1118" font-size="12.5" fill="#475569">产出 · h5ad 持久化 · HTML 报告（generate_scRNA_report）·</text>
  <text x="832" y="1137" font-size="12.5" fill="#475569">scenic_obj.pkl · 火山图 / 热图 / dotplot</text>

  <!-- 带 3：能力边界 -->
  <rect x="40" y="1161" width="4" height="14" rx="2" fill="#B91C1C"/>
  <text x="52" y="1172" font-size="14.5" font-weight="700" fill="#B91C1C">能力边界与已知缺口</text>
  <text x="194" y="1172" font-size="12.5" fill="#94A3B8">过滤发生在提示词层，不是执行层 —— 本图不声称「只能调用这 11 个」</text>

  <rect x="40" y="1184" width="356" height="156" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow-light)"/>
  <rect x="41" y="1185" width="4" height="154" rx="2" fill="#64748B"/>
  <text x="60" y="1210" font-size="13.5" font-weight="700" fill="#334155">过滤是提示词引导，不是沙箱</text>
  <text x="58" y="1236" font-size="12.5" fill="#475569">skills_filter 只裁剪系统提示词里的 skill 列表</text>
  <text x="58" y="1254" font-size="12.5" fill="#475569">工具集不裁：_get_tools() 仍返回全部</text>
  <text x="58" y="1272" font-size="12.5" fill="#475569">skill() 查全局 SKILL_REGISTRY（88 个），不带过滤</text>
  <text x="58" y="1290" font-size="12.5" fill="#475569">实测：不在清单里的 light-figure-drawing /</text>
  <text x="58" y="1308" font-size="12.5" fill="#475569">drug-toxicology 也能被 skill() 加载</text>

  <rect x="428" y="1184" width="356" height="156" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow-light)"/>
