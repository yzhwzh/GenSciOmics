  <text x="244" y="636" font-size="12.5" fill="#94A3B8">转录因子活性与配受体通讯</text>
  <text x="1560" y="636" font-size="11.5" fill="#94A3B8" text-anchor="end">2 个 skill</text>

  <rect x="40" y="646" width="748" height="150" rx="10" fill="#ECFEFF" stroke="#67E8F9" stroke-width="1.2"/>
