  <text x="720" y="598" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">L3 — 数据存储 (Data Storage)</text>

  <rect x="56" y="608" width="320" height="52" rx="5" fill="#FFFFFF" stroke="#FCD34D" stroke-width="0.8" filter="url(#shadow-light)"/>
