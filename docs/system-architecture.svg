  <text x="1224" y="647" text-anchor="middle" font-size="8.5" fill="#64748B">GenSci.log · milestones.json · memory/</text>

  <line x1="720" y1="678" x2="720" y2="692" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-down)"/>

