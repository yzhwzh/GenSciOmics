<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" style="background:#F8FAFC;font-family:'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000012"/></filter>
    <filter id="shadow-light"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0000000A"/></filter>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">Single-cell Atlas — 系统架构图</text>
  <text x="600" y="50" text-anchor="middle" font-size="9" fill="#64748B">System Architecture  |  Layered Container Diagram</text>

  <!-- ════════════════════════════════════════════════════════════
       L1: FRONTEND
     ════════════════════════════════════════════════════════════ -->
  <rect x="40" y="72" width="1120" height="125" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" filter="url(#shadow)"/>
  <text x="600" y="88" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">L1 — 前端应用 (Frontend SPA)</text>
  <text x="60" y="101" font-size="7" fill="#64748B" font-style="italic">React 19 · TypeScript 6 · Vite 8 · Tailwind v4 · ECharts 6</text>

  <!-- HomePage -->
  <rect x="55" y="108" width="340" height="78" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="225" y="122" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#166534">🏠 HomePage (/)</text>
  <text x="65" y="138" font-size="6.5" fill="#475569">  CoreDatasets — 28 组织卡片网格</text>
  <text x="65" y="152" font-size="6.5" fill="#475569">  StatsTable — 组织×物种统计表</text>
  <text x="65" y="166" font-size="6.5" fill="#475569">  TissueAtlas — SVG 人体/小鼠/猴 体图</text>

  <!-- TissuePage -->
  <rect x="410" y="108" width="340" height="78" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="580" y="122" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#166534">🔬 TissuePage (/tissue/:slug)</text>
  <text x="420" y="138" font-size="6.5" fill="#475569">  DatasetTable — 数据集列表 + FilterDropdown</text>
  <text x="420" y="152" font-size="6.5" fill="#475569">  LiteratureTab (Tissue Workspace) — LLM 文献</text>
  <text x="420" y="166" font-size="6.5" fill="#475569">  RawDataDownload — CSV 导出</text>

  <!-- AnalysisPage -->
  <rect x="765" y="108" width="380" height="78" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="955" y="122" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#166534">📊 AnalysisPage (/analysis/:slug/:disease/:pmid)</text>
  <text x="775" y="138" font-size="6.5" fill="#475569">  Tab0:InfoPanel · Tab1:UmapPlot+DualGeneColorMap</text>
  <text x="775" y="152" font-size="6.5" fill="#475569">  Tab2:BoxPlotContainer+DetailTable+MuTestTable</text>
  <text x="775" y="166" font-size="6.5" fill="#475569">  Tab3:ExpressionChartContainer+FisherTable</text>

  <line x1="600" y1="199" x2="600" y2="212" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-down)"/>

  <!-- ════════════════════════════════════════════════════════════
       L2: BACKEND
     ════════════════════════════════════════════════════════════ -->
  <rect x="40" y="218" width="1120" height="195" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" filter="url(#shadow)"/>
  <text x="600" y="234" text-anchor="middle" font-size="10" font-weight="bold" fill="#991B1B">L2 — 后端服务 (Backend Services)</text>
  <text x="60" y="247" font-size="7" fill="#64748B" font-style="italic">Python 3  ·  ThreadingHTTPServer  ·  Port :6000  ·  并发请求处理</text>

  <!-- Core API -->
  <rect x="55" y="256" width="240" height="148" rx="5" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="175" y="271" text-anchor="middle" font-size="8" font-weight="bold" fill="#991B1B">⚙️ Core API</text>
  <line x1="65" y1="279" x2="285" y2="279" stroke="#FEE2E2" stroke-width="0.5"/>
  <text x="65" y="294" font-size="6.8" fill="#475569">config.py · handler.py · routes.py</text>
  <text x="65" y="311" font-size="6.8" fill="#475569">GET /api/datasets /tissues /stats</text>
  <text x="65" y="328" font-size="6.8" fill="#475569">GET /api/umap-data /expression-stats</text>
  <text x="65" y="345" font-size="6.8" fill="#475569">GET /api/plot /search /cell-types</text>
  <text x="65" y="362" font-size="6.8" fill="#475569">POST /api/llm/chat (SSE streaming)</text>
  <text x="65" y="379" font-size="6.8" fill="#475569">POST /api/milestone /heartbeat</text>

  <!-- Analysis -->
  <rect x="310" y="256" width="260" height="148" rx="5" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="440" y="271" text-anchor="middle" font-size="8" font-weight="bold" fill="#991B1B">🔬 Analysis Modules</text>
  <line x1="320" y1="279" x2="560" y2="279" stroke="#FEE2E2" stroke-width="0.5"/>
  <rect x="325" y="288" width="230" height="18" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="0.5"/>
  <text x="440" y="301" text-anchor="middle" font-size="6.5" fill="#9F1239">umap.py — UMAP 坐标提取</text>
  <rect x="325" y="310" width="230" height="18" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="0.5"/>
  <text x="440" y="323" text-anchor="middle" font-size="6.5" fill="#9F1239">expression.py — 基因表达统计</text>
  <rect x="325" y="332" width="230" height="18" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="0.5"/>
  <text x="440" y="345" text-anchor="middle" font-size="6.5" fill="#9F1239">stats.py — MWU / Fisher exact 检验</text>
  <rect x="325" y="354" width="230" height="18" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="0.5"/>
  <text x="440" y="367" text-anchor="middle" font-size="6.5" fill="#9F1239">plots.py — matplotlib → base64 PNG</text>
  <rect x="325" y="376" width="230" height="18" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="0.5"/>
  <text x="440" y="389" text-anchor="middle" font-size="6.5" fill="#9F1239">utils.py — 调色板/基因解析/列检测</text>

  <!-- Infra -->
  <rect x="585" y="256" width="250" height="148" rx="5" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="710" y="271" text-anchor="middle" font-size="8" font-weight="bold" fill="#991B1B">🏗️ Infrastructure</text>
  <line x1="595" y1="279" x2="825" y2="279" stroke="#FEE2E2" stroke-width="0.5"/>
  <rect x="600" y="288" width="220" height="18" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="0.5"/>
  <text x="710" y="301" text-anchor="middle" font-size="6.5" fill="#9F1239">scanner.py — 30s 扫描 .h5ad</text>
  <rect x="600" y="310" width="220" height="18" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="0.5"/>
  <text x="710" y="323" text-anchor="middle" font-size="6.5" fill="#9F1239">search.py — 基因/疾病/PMID 搜索</text>
  <rect x="600" y="332" width="220" height="18" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="0.5"/>
  <text x="710" y="345" text-anchor="middle" font-size="6.5" fill="#9F1239">pubmed.py — EuropePMC 摘要</text>
  <rect x="600" y="354" width="220" height="18" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="0.5"/>
  <text x="710" y="367" text-anchor="middle" font-size="6.5" fill="#9F1239">caches.py — LRUCache</text>
  <rect x="600" y="376" width="220" height="18" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="0.5"/>
  <text x="710" y="389" text-anchor="middle" font-size="6.5" fill="#9F1239">memory/ — memdir 文件记忆系统</text>

  <!-- Agent System -->
  <rect x="850" y="256" width="295" height="148" rx="5" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="997" y="271" text-anchor="middle" font-size="8" font-weight="bold" fill="#991B1B">🤖 Agent System (ReAct Loop)</text>
  <line x1="860" y1="279" x2="1135" y2="279" stroke="#FEE2E2" stroke-width="0.5"/>
  <rect x="865" y="288" width="265" height="18" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="0.5"/>
  <text x="997" y="301" text-anchor="middle" font-size="6.5" fill="#9F1239">① Memory Prefetch → 自动搜索记忆</text>
  <rect x="865" y="310" width="265" height="18" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="0.5"/>
  <text x="997" y="323" text-anchor="middle" font-size="6.5" fill="#9F1239">② assemble_prompt() → 13 章节拼接</text>
  <rect x="865" y="332" width="265" height="18" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="0.5"/>
  <text x="997" y="345" text-anchor="middle" font-size="6.5" fill="#9F1239">③ for-loop ReAct: LLM ↔ tool_calls</text>
  <rect x="865" y="354" width="265" height="18" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="0.5"/>
  <text x="997" y="367" text-anchor="middle" font-size="6.5" fill="#9F1239">④ 并行执行 (ThreadPool3) + hooks</text>
  <rect x="865" y="376" width="265" height="18" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="0.5"/>
  <text x="997" y="389" text-anchor="middle" font-size="6.5" fill="#9F1239">⑤ Streaming 重试 (502/503/504)</text>

  <line x1="600" y1="415" x2="600" y2="428" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-down)"/>

  <!-- ════════════════════════════════════════════════════════════
       L3: DATA STORAGE
     ════════════════════════════════════════════════════════════ -->
  <rect x="40" y="435" width="1120" height="85" rx="6" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1" filter="url(#shadow)"/>
  <text x="600" y="451" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400E">L3 — 数据存储 (Data Storage)</text>

  <rect x="55" y="460" width="240" height="50" rx="5" fill="#FFFFFF" stroke="#FCD34D" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="175" y="476" text-anchor="middle" font-size="8" font-weight="bold" fill="#92400E">📂 .h5ad Data</text>
  <text x="175" y="493" text-anchor="middle" font-size="6.5" fill="#64748B">Data/Human/Lung · Kidney · Joint/...</text>

  <rect x="320" y="460" width="240" height="50" rx="5" fill="#FFFFFF" stroke="#FCD34D" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="440" y="476" text-anchor="middle" font-size="8" font-weight="bold" fill="#92400E">💾 Disk Cache</text>
  <text x="440" y="493" text-anchor="middle" font-size="6.5" fill="#64748B">.scanner_cache.json  ·  mtime 比对</text>

  <rect x="585" y="460" width="240" height="50" rx="5" fill="#FFFFFF" stroke="#FCD34D" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="705" y="476" text-anchor="middle" font-size="8" font-weight="bold" fill="#92400E">🧠 Memory Cache</text>
  <text x="705" y="493" text-anchor="middle" font-size="6.5" fill="#64748B">LRUCache (obs stats · plots)  max 1000</text>

  <rect x="850" y="460" width="295" height="50" rx="5" fill="#FFFFFF" stroke="#FCD34D" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="997" y="476" text-anchor="middle" font-size="8" font-weight="bold" fill="#92400E">📝 Logs · Events · Memory</text>
  <text x="997" y="493" text-anchor="middle" font-size="6.5" fill="#64748B">GenSci.log · milestones.json · server/memory/</text>

  <line x1="600" y1="522" x2="600" y2="535" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-down)"/>

  <!-- ════════════════════════════════════════════════════════════
       L4: EXTERNAL
     ════════════════════════════════════════════════════════════ -->
  <rect x="40" y="542" width="1120" height="78" rx="6" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1" filter="url(#shadow)"/>
  <text x="600" y="558" text-anchor="middle" font-size="10" font-weight="bold" fill="#5B21B6">L4 — 外部集成 (External)</text>

  <rect x="170" y="568" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="305" y="583" text-anchor="middle" font-size="8" font-weight="bold" fill="#5B21B6">🧠 LLM Gateway</text>
  <text x="305" y="599" text-anchor="middle" font-size="6.5" fill="#64748B">llm-gateway.ai.dgtmeta.com · Qwen3.5-397B</text>

  <rect x="465" y="568" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="600" y="583" text-anchor="middle" font-size="8" font-weight="bold" fill="#5B21B6">🔌 MCP Servers</text>
  <text x="600" y="599" text-anchor="middle" font-size="6.5" fill="#64748B">GitHub · Playwright · Exa · Context7 · SeqThinking</text>

  <rect x="760" y="568" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="895" y="583" text-anchor="middle" font-size="8" font-weight="bold" fill="#5B21B6">📚 EuropePMC</text>
  <text x="895" y="599" text-anchor="middle" font-size="6.5" fill="#64748B">PubMed 文献摘要 · pubmed.py 封装</text>

  <!-- DATA FLOW -->
  <text x="1080" y="110" font-size="6.5" fill="#64748B" font-style="italic">Request</text>
  <text x="1080" y="122" font-size="6.5" fill="#64748B" font-style="italic">↓ JSON</text>
  <text x="1080" y="134" font-size="6.5" fill="#64748B" font-style="italic">↑ base64 PNG</text>

  <!-- LEGEND -->
  <g transform="translate(40,635)">
    <rect width="1120" height="28" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.8"/>
    <text x="15" y="19" font-size="8" font-weight="bold" fill="#475569">图例:</text>
    <rect x="65" y="9" width="12" height="12" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
    <text x="82" y="19" font-size="7" fill="#64748B">Frontend</text>
    <rect x="145" y="9" width="12" height="12" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
    <text x="162" y="19" font-size="7" fill="#64748B">Backend</text>
    <rect x="220" y="9" width="12" height="12" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="0.8"/>
    <text x="237" y="19" font-size="7" fill="#64748B">Data</text>
    <rect x="280" y="9" width="12" height="12" rx="3" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="0.8"/>
    <text x="297" y="19" font-size="7" fill="#64748B">External</text>
    <line x1="360" y1="15" x2="390" y2="15" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-down)"/>
    <text x="397" y="19" font-size="7" fill="#64748B">Request flow</text>
  </g>

  <!-- VERSION BADGE -->
  <rect x="1010" y="56" width="150" height="18" rx="9" fill="#6366F1" stroke="none" filter="url(#shadow-light)"/>
  <text x="1085" y="69" text-anchor="middle" font-size="7" font-weight="bold" fill="#FFF">v2·v3·v4  Modular</text>
</svg>
