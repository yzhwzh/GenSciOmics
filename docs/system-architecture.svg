<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" width="100%" height="100%" style="background:#F8FAFC;font-family:'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000012"/></filter>
    <filter id="shadow-light"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0000000A"/></filter>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="720" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E293B">GenSciOmics — 系统架构图</text>
  <text x="720" y="52" text-anchor="middle" font-size="11" fill="#64748B">System Architecture  |  Layered Container Diagram  |  单细胞 · Bulk RNA · 蛋白质组 · 药物发现</text>

  <!-- ════════════════════════════════════════════════════════════
       L1: FRONTEND
     ════════════════════════════════════════════════════════════ -->
  <rect x="40" y="70" width="1360" height="165" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" filter="url(#shadow)"/>
  <text x="720" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">L1 — 前端应用 (Frontend SPA)</text>
  <text x="56" y="104" font-size="9" fill="#64748B" font-style="italic">React 19 · TypeScript 6 · Vite 8 · Tailwind v4 · ECharts 6 · react-router v7  —  6 条路由</text>

  <!-- 1 HomePage -->
  <rect x="56" y="112" width="209" height="112" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="66" y="129" font-size="10.5" font-weight="bold" fill="#166534">🏠 HomePage</text>
  <text x="66" y="143" font-size="7.5" fill="#94A3B8">/</text>
  <text x="66" y="161" font-size="8.5" fill="#475569">CoreDatasets — 组织卡片</text>
  <text x="66" y="177" font-size="8.5" fill="#475569">TissueAtlas — SVG 体图</text>
  <text x="66" y="193" font-size="8.5" fill="#475569">StatsTable — 组织×物种</text>
  <text x="66" y="209" font-size="8.5" fill="#475569">OnlineUsers · UpdateLog</text>

  <!-- 2 DatasetPage -->
  <rect x="280" y="112" width="209" height="112" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="290" y="129" font-size="10.5" font-weight="bold" fill="#166534">📄 DatasetPage</text>
  <text x="290" y="143" font-size="7.5" fill="#94A3B8">/dataset/:slug</text>
  <text x="290" y="161" font-size="8.5" fill="#475569">数据集详情</text>
  <text x="290" y="177" font-size="8.5" fill="#475569">按 URL slug 查数据集</text>
  <text x="290" y="193" font-size="8.5" fill="#475569">未命中回退 Unknown</text>
  <text x="290" y="209" font-size="8" fill="#94A3B8" font-style="italic">(占位页，待补)</text>

  <!-- 3 TissuePage -->
  <rect x="504" y="112" width="209" height="112" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="514" y="129" font-size="10.5" font-weight="bold" fill="#166534">🔬 TissuePage</text>
  <text x="514" y="143" font-size="7.5" fill="#94A3B8">/tissue/:slug</text>
  <text x="514" y="161" font-size="8.5" fill="#475569">DatasetInfo + 筛选器</text>
  <text x="514" y="177" font-size="8.5" fill="#475569">OmicsTab — 组学切换</text>
  <text x="514" y="193" font-size="8.5" fill="#475569">LiteratureTab — LLM</text>
  <text x="514" y="209" font-size="8.5" fill="#475569">CSV 数据导出</text>

  <!-- 4 AnalysisPage -->
  <rect x="728" y="112" width="209" height="112" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="738" y="129" font-size="10.5" font-weight="bold" fill="#166534">📊 AnalysisPage</text>
  <text x="738" y="143" font-size="7" fill="#94A3B8">/analysis/:tissue/:disease/:pmid</text>
  <text x="738" y="161" font-size="8.5" fill="#475569">单细胞: UMAP/Box/Bar</text>
  <text x="738" y="177" font-size="8.5" fill="#475569">Bulk/蛋白: Expression &amp; DE</text>
  <text x="738" y="193" font-size="8.5" fill="#475569">共同: Study Info</text>
  <text x="738" y="209" font-size="8.5" fill="#475569">共同: Free Analysis</text>

  <!-- 5 SearchPage -->
  <rect x="952" y="112" width="209" height="112" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="962" y="129" font-size="10.5" font-weight="bold" fill="#166534">🔎 SearchPage</text>
  <text x="962" y="143" font-size="7.5" fill="#94A3B8">/search</text>
  <text x="962" y="161" font-size="8.5" fill="#475569">基因/疾病/PMID/细胞型</text>
  <text x="962" y="177" font-size="8.5" fill="#475569">useTableFilter + 筛选器</text>
  <text x="962" y="193" font-size="8.5" fill="#475569">匹配类型分类着色</text>
  <text x="962" y="209" font-size="8.5" fill="#475569">外部链接直达</text>

  <!-- 6 DrugDiscoveryPage -->
  <rect x="1176" y="112" width="209" height="112" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="1186" y="129" font-size="10.5" font-weight="bold" fill="#166534">💊 DrugDiscovery</text>
  <text x="1186" y="143" font-size="7.5" fill="#94A3B8">/drug-discovery</text>
  <text x="1186" y="161" font-size="8.5" fill="#475569">6 阶段发现流水线</text>
  <text x="1186" y="177" font-size="8.5" fill="#475569">阶段锁定 skill 过滤</text>
  <text x="1186" y="193" font-size="8.5" fill="#475569">SSE 流式编排</text>
  <text x="1186" y="209" font-size="8.5" fill="#475569">前序阶段结论传递</text>

  <line x1="720" y1="238" x2="720" y2="252" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-down)"/>

  <!-- ════════════════════════════════════════════════════════════
       L2: BACKEND
     ════════════════════════════════════════════════════════════ -->
  <rect x="40" y="252" width="1360" height="310" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" filter="url(#shadow)"/>
  <text x="720" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#991B1B">L2 — 后端服务 (Backend Services)</text>
  <text x="56" y="286" font-size="9" fill="#64748B" font-style="italic">Python 3 标准库  ·  ThreadingHTTPServer  ·  端口 :6001  ·  38 个 API 端点  ·  无外部 Web 框架</text>

  <!-- Core API -->
  <rect x="56" y="296" width="256" height="252" rx="5" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="184" y="318" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991B1B">⚙️ Core API</text>
  <line x1="68" y1="328" x2="300" y2="328" stroke="#FEE2E2" stroke-width="0.5"/>
  <text x="68" y="348" font-size="8" fill="#64748B">config.py · handler.py · routes.py</text>
  <text x="68" y="370" font-size="8" fill="#475569">GET  数据集 / 组织 / 统计 / 日志</text>
  <text x="68" y="390" font-size="8" fill="#475569">GET  UMAP / 表达 / 分组 / 表格</text>
  <text x="68" y="410" font-size="8" fill="#475569">GET  散点 / 箱线 / 火山 / 点图</text>
  <text x="68" y="430" font-size="8" fill="#475569">GET  基因补全 / 文献摘要</text>
  <text x="68" y="452" font-size="8" fill="#475569">POST LLM 对话（SSE 流式）</text>
  <text x="68" y="472" font-size="8" fill="#475569">POST 药物流水线（SSE）</text>
  <text x="68" y="492" font-size="8" fill="#475569">POST 里程碑 / 心跳 / 在线数</text>
  <text x="68" y="516" font-size="8" fill="#9F1239">dict 路由表分发 · 路径白名单校验</text>

  <!-- Analysis Modules -->
  <rect x="324" y="296" width="256" height="252" rx="5" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="452" y="318" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991B1B">🔬 Analysis Modules</text>
  <line x1="336" y1="328" x2="568" y2="328" stroke="#FEE2E2" stroke-width="0.5"/>
  <text x="336" y="348" font-size="8" fill="#64748B">server/analysis/</text>
  <text x="336" y="372" font-size="8" fill="#475569">umap.py — UMAP 坐标提取</text>
  <text x="336" y="394" font-size="8" fill="#475569">expression.py — 单细胞表达</text>
  <text x="336" y="416" font-size="8" fill="#475569">bulk.py — Bulk/蛋白 DE ·</text>
  <text x="336" y="430" font-size="8" fill="#475569">        火山图 · 分组识别</text>
  <text x="336" y="452" font-size="8" fill="#475569">stats.py — MWU / Fisher</text>
  <text x="336" y="474" font-size="8" fill="#475569">plots.py — matplotlib → PNG</text>
  <text x="336" y="496" font-size="8" fill="#475569">utils.py — 调色板 / 基因解析</text>
  <text x="336" y="516" font-size="8" fill="#9F1239">        / 分组列检测</text>

  <!-- Agent System -->
  <rect x="592" y="296" width="256" height="252" rx="5" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="720" y="318" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991B1B">🤖 Agent System (ReAct)</text>
  <line x1="604" y1="328" x2="836" y2="328" stroke="#FEE2E2" stroke-width="0.5"/>
  <text x="604" y="348" font-size="8" fill="#64748B">llm_proxy.py → agent/</text>
  <text x="604" y="372" font-size="8" fill="#475569">llm_proxy — SSE 入口 ·</text>
  <text x="604" y="386" font-size="8" fill="#475569">  按组学类型分域 skill</text>
  <text x="604" y="408" font-size="8" fill="#475569">prompt.py — 13 章节拼装</text>
  <text x="604" y="430" font-size="8" fill="#475569">evaluator.py — 结果评估</text>
  <text x="604" y="444" font-size="8" fill="#475569">  + SQLite 日志</text>
  <text x="604" y="466" font-size="8" fill="#475569">engine/hooks.py — 后置钩子</text>
  <text x="604" y="488" font-size="8" fill="#475569">并行工具调用 (ThreadPool 3)</text>
  <text x="604" y="510" font-size="8" fill="#9F1239">记忆预取 → 注入 system msg</text>

  <!-- Skills -->
  <rect x="860" y="296" width="256" height="252" rx="5" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="988" y="318" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991B1B">🧩 Skills — 83 个</text>
  <line x1="872" y1="328" x2="1104" y2="328" stroke="#FEE2E2" stroke-width="0.5"/>
  <text x="872" y="348" font-size="8" fill="#64748B">server/skills/&lt;name&gt;/</text>
  <text x="872" y="370" font-size="8" fill="#475569">核心工具 6 — shell / skill /</text>
  <text x="872" y="384" font-size="8" fill="#475569">  tool_search / memory ×3</text>
  <text x="872" y="406" font-size="8" fill="#475569">light-* 28 — 图表 / 文献 /</text>
  <text x="872" y="420" font-size="8" fill="#475569">  写作 / 投稿 / 引用核验</text>
  <text x="872" y="442" font-size="8" fill="#475569">drug-* 29 — 6 阶段药物发现</text>
  <text x="872" y="464" font-size="8" fill="#475569">bulk-* 10 — Bulk / 蛋白质组</text>
  <text x="872" y="486" font-size="8" fill="#475569">single-* 10 — 单细胞全流程</text>
  <text x="872" y="508" font-size="8" fill="#9F1239">protein-* / proteomics-* 4</text>

  <!-- Infrastructure -->
  <rect x="1128" y="296" width="256" height="252" rx="5" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.8" filter="url(#shadow-light)"/>
  <text x="1256" y="318" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991B1B">🏗️ Infrastructure</text>
  <line x1="1140" y1="328" x2="1372" y2="328" stroke="#FEE2E2" stroke-width="0.5"/>
  <text x="1140" y="348" font-size="8" fill="#475569">scanner.py — 30s 扫描 .h5ad</text>
  <text x="1140" y="368" font-size="8" fill="#475569">search.py — 基因/疾病/PMID</text>
  <text x="1140" y="388" font-size="8" fill="#475569">pubmed.py — EuropePMC 摘要</text>
  <text x="1140" y="408" font-size="8" fill="#475569">caches.py — LRUCache（限 1000）</text>
  <text x="1140" y="428" font-size="8" fill="#475569">core/adata_cache.py — AnnData</text>
  <text x="1140" y="442" font-size="8" fill="#475569">  句柄缓存</text>
  <text x="1140" y="462" font-size="8" fill="#475569">core/mcp_manager.py — MCP 连接</text>
  <text x="1140" y="482" font-size="8" fill="#475569">events.py · online.py ·</text>
  <text x="1140" y="496" font-size="8" fill="#475569">supplementary.py</text>
  <text x="1140" y="516" font-size="8" fill="#9F1239">drug_stages.py · bulk_import.py</text>

  <line x1="720" y1="565" x2="720" y2="579" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-down)"/>

