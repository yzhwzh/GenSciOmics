  <text x="56" y="1050" font-size="13.5" font-weight="bold" fill="#991B1B">能力边界 —— 写死在注册表里，不允许被过度承诺</text>
  <text x="56" y="1070" font-size="12.5" fill="#7F1D1D">ToolUniverse 覆盖的是「用公开数据做研究与评估」。以下能力没有，被问到时必须直说做不到，不得编造流程或产出：</text>
  <text x="56" y="1090" font-size="12.5" fill="#7F1D1D">① IND/CTA/eCTD 申报文档撰写　② GLP 毒理试验设计（种属 / 剂量组 / 终点）　③ CMC / 制剂 / 生产工艺　④ in-vivo PK/PD、动物药效模型、异速放大　⑤ 专用 SAR / 多参数先导优化</text>

